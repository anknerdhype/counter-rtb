databases:
  - name: counter-rtb-db
    plan: free
    databaseName: counter_rtb

services:
  - type: web
    name: counter-rtb
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: counter-rtb-db
          property: connectionString
