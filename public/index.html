<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stückzähler - RTB &amp; C&amp;C</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Stückzähler</h1>
    <div class="date-display" id="currentDate"></div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div class="error-banner" id="errorBanner" role="alert" hidden></div>

  <main>
    <section class="counter-grid" id="counterSection">
      <div class="counter-section" data-category="rtb">
        <h2 class="counter-title">RTB</h2>
        <div class="counter-box">
          <button class="counter-btn decrement" data-delta="-1" title="RTB minus" aria-label="RTB minus">−</button>
          <div class="counter-value" data-role="value">0</div>
          <button class="counter-btn increment" data-delta="1" title="RTB plus" aria-label="RTB plus">+</button>
        </div>
        <p class="counter-label">Stück heute</p>
      </div>

      <div class="counter-section" data-category="cc">
        <h2 class="counter-title">C&amp;C</h2>
        <div class="counter-box">
          <button class="counter-btn decrement" data-delta="-1" title="C&amp;C minus" aria-label="C&amp;C minus">−</button>
          <div class="counter-value" data-role="value">0</div>
          <button class="counter-btn increment" data-delta="1" title="C&amp;C plus" aria-label="C&amp;C plus">+</button>
        </div>
        <p class="counter-label">Stück heute</p>
      </div>

      <div class="note-section">
        <label class="note-title" for="noteInput">Notiz zum Tag</label>
        <textarea id="noteInput" rows="3" maxlength="2000"
          placeholder="Besonderheiten, Störungen, Material …"></textarea>
        <p class="note-status" id="noteStatus" aria-live="polite"></p>
      </div>
    </section>

    <section class="history-section">
      <div class="history-header">
        <h2>Erfasste Daten</h2>
        <div class="history-controls">
          <select id="filterMonth">
            <option value="">Alle Monate</option>
          </select>
        </div>
      </div>
      <div class="table-wrapper">
        <table id="historyTable">
          <thead>
            <tr>
              <th class="col-employee">Mitarbeiter</th>
              <th>Datum</th>
              <th class="num">RTB</th>
              <th class="num">C&amp;C</th>
              <th class="num">Gesamt</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
        <p class="empty-state" id="emptyState">Noch keine Daten erfasst.</p>
      </div>
    </section>

    <section class="export-section">
      <h2>Export</h2>
      <div class="export-buttons">
        <button class="btn-export" id="btnExportAll">Alle Daten exportieren (CSV)</button>
        <button class="btn-export" id="btnExportMonth">Aktuellen Monat exportieren (CSV)</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
